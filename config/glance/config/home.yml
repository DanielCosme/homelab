- name: Home
  # head-widgets:
  columns:
    - size: small
      widgets:
        - type: bookmarks
          groups:
            - title: "Hosted in Homelab"
              description: "Hosted in my personal homlab, some of them accesible on my Private VPN, others publicly exposed via reverse proxy"
              color: 200 50 50
              links:
                - title: Immich
                  icon: sh:immich
                  url: https://photos.danicos.me
                - title: Immich VPN
                  icon: sh:immich
                  url: http://hydra-0.orca-uaru.ts.net:30011
                - title: Linkding
                  icon: sh:linkding
                  url: https://link.danicos.me
                - title: TrueNAS VPN
                  icon: sh:truenas-core
                  url: http://apex-truenas.orca-uaru.ts.net
            - title: "Hosted in the Cloud"
              description: "Hosted in my OVH Cloud VPS"
              color: 10 70 50
              links:
                - title: Curious Ape
                  icon: si:spidermonkey
                  url: https://ape.danicos.me
                - title: Personal Webpage
                  icon: mdi:web
                  url: https://danicos.me
                - title: Git platform (Gitea)
                  icon: sh:gitea
                  url: https://danicos.dev
            - title: "Public"
              color: 100 40 25
              links:
                - title: Github
                  icon: sh:github
                  url: https://github.com/danielcosme
                - title: X
                  icon: sh:x
                  url: https://x.com/Cosmedani05
    - size: full
      widgets:
        - type: rss
          limit: 15
          collapse-after: 5
          style: detailed-list
          cache: 12h
          feeds:
            - url: https://selfh.st/rss/
              title: selfh.st
              # limit: 3

        - type: videos
          title: Chill Music
          channels:
            - UCD3mA_LbjO8V515Hw1jlYhg # Cigarette in Paris
            - UC9fr5ejRTqZWIBn5CfqEKng # The Silent Gentleman
          # playlists:
          style: horizontal-cards
          # limit

    - size: small
      widgets:
        - type: clock
          hour-format: 24h
          timezones:
            - timezone: America/Montreal
              label: Montreal
            - timezone: America/Bogota
              label: Bogota
            - timezone: America/Vancouver
              label: Vancouver
            - timezone: UTC
              label: UTC
            - timezone: Europe/Madrid
              label: Madrid
            - timezone: Europe/Sofia
              label: Sofia (Bulgaria)

        - type: calendar
          first-day-of-week: monday

        - type: weather
          location: Montreal, Canada
          units: metric # alternatively "imperial"
          hour-format: 24h # alternatively "24h"
          # Optionally hide the location from being displayed in the widget
          # hide-location: true

- name: Entertainment
  columns:
    - size: small
      widgets:
        - type: twitch-channels
          channels:
            - theprimeagen
            - j_blow

    - size: full
      widgets:
        - type: videos
          title: Entertainment
          channels:
            - UCtinbF-Q-fVthA0qrFQTgXQ # Casey Neistat
          # playlists:
          style: grid-cards
          # limit
- name: Info
  columns:
    - size: full
      widgets:
        - type: calendar
          first-day-of-week: monday
    - size: small
      widgets:
        - type: markets
          markets:
            - symbol: SPY
              name: S&P 500
            - symbol: BTC-USD
              name: Bitcoin
            - symbol: NVDA
              name: NVIDIA
            - symbol: AAPL
              name: Apple
            - symbol: MSFT
              name: Microsoft
- name: Default
  # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
  # hide-desktop-navigation: true
  columns:
    - size: small
      widgets:
        - type: calendar
          first-day-of-week: monday

    - size: full
      widgets:
        - type: group
          widgets:
            - type: hacker-news
            - type: lobsters

        - type: group
          widgets:
            - type: reddit
              subreddit: technology
              show-thumbnails: true
            - type: reddit
              subreddit: selfhosted
              show-thumbnails: true

    - size: small
      widgets:
        - type: weather
          location: London, United Kingdom
          units: metric # alternatively "imperial"
          hour-format: 12h # alternatively "24h"
          # Optionally hide the location from being displayed in the widget
          # hide-location: true

        - type: markets
          markets:
            - symbol: SPY
              name: S&P 500
            - symbol: BTC-USD
              name: Bitcoin
            - symbol: NVDA
              name: NVIDIA
            - symbol: AAPL
              name: Apple
            - symbol: MSFT
              name: Microsoft

        - type: releases
          cache: 1d
          # Without authentication the Github API allows for up to 60 requests per hour. You can create a
          # read-only token from your Github account settings and use it here to increase the limit.
          # token: ...
          repositories:
            - glanceapp/glance
            - go-gitea/gitea
            - immich-app/immich
            - syncthing/syncthing
