apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: immich
  name: immich
  namespace: immich
spec:
  selector:
    matchLabels:
      app: immich
  strategy: {}
  template:
    metadata:
      labels:
        app: immich
    spec:
      containers:
      - env:
        - name: DB_DATABASE_NAME
          valueFrom:
            secretKeyRef:
              key: db_username
              name: immich-secret
        - name: DB_HOSTNAME
          valueFrom:
            secretKeyRef:
              key: db_host
              name: immich-secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: db_password
              name: immich-secret
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              key: db_port
              name: immich-secret
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              key: db_username
              name: immich-secret
        image: ghcr.io/immich-app/immich-server:v2.6.0:-release}
        name: immich-server
        ports:
        - containerPort: 2283
        resources: {}
      volumes:
      - name: upload
        persistentVolumeClaim:
          claimName: immich-pvc
status: {}
