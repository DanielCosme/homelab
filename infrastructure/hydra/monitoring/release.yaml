apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      interval: 12h0m0s
      sourceRef:
        kind: HelmRepository
        name: monitoring
        namespace: monitoring
      version: 66.x
  driftDetection:
    ignore:
    - paths:
      - /metadata/annotations/prometheus-operator-validated
      target:
        kind: PrometheusRule
    mode: enabled
  install:
    crds: Create
  interval: 30m0s
  upgrade:
    crds: CreateReplace
  values:
    grafana:
      adminPassword: grafana-admin
status: {}
